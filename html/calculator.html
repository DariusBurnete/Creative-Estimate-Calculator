<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/calculator.css">
    <script type="module" src="../javascript/type.js" defer></script>
    <script type="module" src="../javascript/json_ads.js" defer></script>
    <title>CEC</title>
</head>
<body>

    <div class="typeMenu">
        <label>Project type</label>
        <div class="typeButtons">
            <button onclick="DropdownToggle()" class="typeButton">Select</button>
            <button onclick="AddTypeToggle()" class="addTypeButton">+</button>
            <button onclick="DeleteType()" class="deleteTypeButton" title="Delete selected type">-</button>
        </div>

        <div class="typeDropdown" style="display: none;"></div>
    </div>

    <div class="showComplexity">
        <label>Estimated complexity</label>
        <p id="showComplexity"></p>
    </div>

    <div class="stages">
        <label>Stages | hours | minutes</label>
    </div>

    <div class="estimatedTime">
        <label>Estimated time:</label>
        <p id="estimatedTime"></p>
    </div>

    <div class="hourlyRate">
        <label>Hourly rate:</label>
        <input type="number" id="hourlyRate" name="hourlyRate">
        <p>$</p>
    </div>

    <div class="estimatedCost">
        <label>Estimated cost:</label>
        <p id="estimatedCost"></p>
    </div>

    <div class="typeButtons">
        <button onclick="SaveValues()" class="saveButton" title="Save the new values of an existing type">
            Save values
        </button>
    </div>

    <div class="addTypeDropdown" style="display: none;">
        <input type="text" id="addTypeName" name="addTypeName" placeholder="Enter new type">
        <button onclick="AddStage()" id="addTypeStage">Add Stage</button>
        <div class="newStageInputs"></div>
        <button onclick="SaveNewType()" id="saveNewType">Save</button>
    </div>

</body>
</html>

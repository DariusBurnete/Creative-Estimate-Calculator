<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/calculator.css">
    <script type="module" src="../javascript/type.js" defer></script>
    <title>CEC</title>
</head>
<body>

    <div class="typeMenu">
        <label for="projects">Project type</label>
        <div class="typeButtons">
            <button onclick="dropdownToggle()" class="typeButton">Select</button>
            <button class="addTypeButton">+</button>
            <button class="deleteTypeButton">-</button>
        </div>

        <div class="typeDropdown" style="display: none;"></div>
    </div>

    <div class="showComplexity">
        <label for="complexity">Estimated complexity</label>
        <p id="showComplexity"></p>
    </div>

    <div class="stages">
        <label for="stages">Stages | hours | minutes</label>
    </div>

    <div class="estimatedTime">
        <label for="estimatedTime">Estimated time:</label>
        <p id="estimatedTime"></p>
    </div>

    <div class="hourlyRate">
        <label for="hourlyRate">Hourly rate:</label>
        <input type="number" id="hourlyRate" name="hourlyRate" required>
        <p>$</p>
    </div>

    <div class="estimatedCost">
        <label for="estimatedCost">Estimated cost:</label>
        <p id="estimatedCost"></p>
    </div>

    
</body>
</html>
